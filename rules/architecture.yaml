rules:
  - id: ARCH-001
    name: MVVM with Clean Architecture
    category: architecture
    severity: CRITICAL
    description: >
      Mobile features must follow MVVM with Clean Architecture as the explicit architectural constraint.
    requirements:
      - Use MVVM for presentation architecture.
      - Separate presentation from business logic.
      - Isolate data access behind abstractions.
      - Keep business logic outside the View.
    forbidden:
      - Business logic directly inside the View.
      - Direct API calls from the View.
      - Direct database access from the View.
    enforcement: [AI, STATIC]
    ai_guidance:
      instructions:
        - "Act as a Principal Mobile Engineer."
        - "Write this feature using MVVM with Clean Architecture."
        - "Isolate side effects by ensuring ViewModels/Presenters depend on abstract Repositories or Interactors via Dependency Injection."
      review_questions:
        - "Does the View contain business logic?"
        - "Does the View directly access networking or persistence?"
    evidence:
      reference: "Architecture & State Blueprint"

  - id: ARCH-002
    name: Unidirectional Data Flow
    category: architecture
    severity: HIGH
    description: UI data flow must remain predictable and unidirectional.
    requirements:
      - UI renders immutable state.
      - User actions are represented as intents/events.
      - State transitions are predictable.
      - ViewModel manages UI state.
    forbidden:
      - View directly mutating application state.
      - Multiple uncontrolled sources of UI state.
      - Hidden state mutations.
    enforcement: [AI, STATIC]
    ai_guidance:
      instructions:
        - "Force the AI to model state as a single, immutable source of truth."
        - "The View must be a passive reflection of an immutable UI State object."
        - "State transitions must happen exclusively via predictable user intents."
      review_questions:
        - "Is UI state immutable?"
        - "Is state changed through a predictable transition?"
    evidence:
      reference: "Architecture & State Blueprint"

  - id: ARCH-003
    name: Passive View
    category: architecture
    severity: HIGH
    description: View must be a passive reflection of state and forward user actions without owning business rules.
    requirements:
      - View renders state.
      - View forwards user actions.
      - View does not contain business logic.
    forbidden:
      - Business rules inside UI components.
      - API invocation directly from UI.
      - Repository access directly from UI.
    enforcement: [AI, STATIC]
    ai_guidance:
      instructions:
        - "Ensure the UI merely renders state and forwards events/intents to the ViewModel."
      review_questions:
        - "Are there any direct repository references or API calls inside the view components?"
    evidence:
      reference: "Architecture & State Blueprint"

  - id: ARCH-004
    name: Dependency Injection
    category: architecture
    severity: HIGH
    description: All components must be injected using explicit frameworks rather than manually resolved or created inline.
    requirements:
      - Dependencies must be injected.
      - Side effects must be isolated behind abstractions.
      - Repository/Interactor dependencies must be injectable.
    forbidden:
      - Feature-specific global singletons.
      - Hidden dependency creation inside business logic.
    enforcement: [AI, STATIC]
    ai_guidance:
      instructions:
        - "For strict Dependency Injection, use approved frameworks (e.g., Hilt, Resolver, Inversify)."
      review_questions:
        - "Are external boundaries properly abstracted behind interfaces and supplied via DI?"
    evidence:
      reference: "Architecture & State Blueprint"

  - id: ARCH-005
    name: Reusable Custom UI Widgets
    category: architecture
    severity: HIGH
    description: >
      Shared application controls must be implemented as reusable, accessible custom widgets
      so their behavior and presentation remain consistent across features and platforms.
    requirements:
      - Provide shared custom widgets for recurring application controls such as buttons, text fields, selection controls, and dialogs.
      - Build feature screens from the shared widgets instead of styling equivalent platform controls independently.
      - Expose intentional variants and state through typed parameters rather than duplicating widgets for minor visual differences.
      - Support accessibility semantics, keyboard or screen-reader interaction, and enabled, focused, error, and loading states where relevant.
      - Keep widgets presentational; delegate business behavior and state transitions to the owning presentation layer.
    forbidden:
      - Repeated feature-specific implementations of the same application control.
      - Direct use of raw platform controls for application-wide shared controls when an approved custom widget exists.
      - Business rules, data access, or feature-specific side effects inside reusable widgets.
      - Inconsistent control behavior or styling caused by bypassing the shared widget library.
    enforcement: [AI, STATIC, TEST]
    ai_guidance:
      instructions:
        - "Before implementing a UI control, find and reuse the closest existing shared custom widget."
        - "If a required shared control does not exist, add it to the shared UI component library and document its supported variants."
        - "Keep custom widgets reusable and accessible, and keep feature logic in the ViewModel or equivalent presentation state holder."
      review_questions:
        - "Were existing custom widgets reused for recurring controls such as buttons and text fields?"
        - "Does a new reusable control have a single shared implementation rather than feature-specific copies?"
        - "Do widgets expose accessible semantics and relevant interaction states?"
        - "Is business logic kept outside reusable UI widgets?"
    evidence:
      reference: "Shared UI Component Architecture"

  - id: ARCH-006
    name: Centralized Theme and Typography System
    category: architecture
    severity: HIGH
    description: >
      The application must provide a centralized design system with light and dark themes,
      approved typography, and semantic color tokens applied consistently throughout the UI.
    requirements:
      - Define light and dark palettes centrally using semantic color roles rather than feature-specific color values.
      - Allow the user to select light or dark appearance and provide a documented system-default behavior when supported by the platform.
      - Define and reuse approved font families, weights, and a consistent typography scale through shared text styles.
      - Apply shared spacing, shape, and component tokens alongside colors and typography where supported by the design system.
      - Ensure text, controls, focus indicators, and error states remain legible and accessible in both themes.
      - Keep theme switching consistent across screens and preserve the selected appearance according to product settings policy.
    forbidden:
      - Hardcoded color or font values scattered across feature screens and widgets.
      - A light-only or dark-only interface when the application is expected to support both themes.
      - Theme-specific components that duplicate behavior instead of using shared theme tokens.
      - Color choices that make content, focus, error, or disabled states unreadable in either theme.
    enforcement: [AI, STATIC, TEST]
    ai_guidance:
      instructions:
        - "Use the centralized design tokens and typography styles; do not invent per-screen colors or font styles."
        - "Implement and verify both light and dark appearances, including interactive and error states."
        - "Honor the product's theme preference behavior and ensure shared widgets respond to theme changes."
      review_questions:
        - "Are light and dark themes defined centrally and available throughout the application?"
        - "Are font family, weight, and type scale sourced from shared typography tokens?"
        - "Are colors semantic tokens rather than hardcoded values in feature UI?"
        - "Are text and interaction states legible in both themes?"
    evidence:
      reference: "Application Design System"
